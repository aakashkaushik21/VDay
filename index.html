<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#ffeef6;
      --card:#ffffffcc;
      --yes:#ff3b7a;
      --yesHover:#ff1f68;
      --text:#111827;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow:hidden;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      color: var(--text);
    }

    /* FULL-SCREEN CONFETTI CANVAS */
    #confettiCanvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:9999;
    }

    .card{
      width:min(720px, 92vw);
      padding: clamp(18px, 3.6vw, 26px) clamp(16px, 3vw, 22px);
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align:center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
      position: relative;
      overflow: hidden; /* needed for slide transition */
    }

    /* Mute button */
    #muteBtn{
      position:absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.9);
      border:none;
      border-radius:999px;
      padding: 10px 12px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,.15);
      line-height: 1;
      z-index: 10;
    }

    /* --- SLIDE PAGES --- */
    .stage{
      position: relative;
      width: 100%;
      min-height: 420px;
    }

    .page{
      position: absolute;
      inset: 0;
      padding-top: 8px;
      display: grid;
      grid-auto-rows: min-content;
      align-content: start;
      justify-items: center;
      gap: 8px;
      transition: transform 520ms cubic-bezier(.2,.9,.2,1), opacity 420ms ease;
      will-change: transform;
    }

    /* initial positions */
    #questionPage{ transform: translateX(0%); opacity: 1; }
    #yesPage{ transform: translateX(110%); opacity: 1; }

    /* when active */
    .card.show-yes #questionPage{ transform: translateX(-110%); opacity: .98; }
    .card.show-yes #yesPage{ transform: translateX(0%); opacity: 1; }

    /* Art */
    .art{
      width: min(240px, 68vw);
      margin: 8px auto 2px;
      display:block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1{
      font-size: clamp(22px, 5.4vw, 44px);
      line-height: 1.12;
      margin: 6px 0 10px;
      padding: 0 6px;
    }

    .sub{
      font-size: 14px;
      opacity: .75;
      margin: 0 0 8px;
    }

    /* Buttons */
    .button-zone{
      position:relative;
      width: min(560px, 100%);
      height: clamp(140px, 22vh, 180px);
      margin: 6px auto 0;
      touch-action:none;
    }

    button.choice{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 22px;
      min-width: 120px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border:none;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
      touch-action: manipulation;
    }

    #yesBtn{
      left: 10%;
      background: var(--yes);
      color:#fff;
    }
    #yesBtn:hover{ background: var(--yesHover); }

    #noBtn{
      right: 10%;
      left:auto;
      background:#e5e7eb;
      color:#111827;
    }

    /* small phones: stack vertically so nothing overlaps */
    @media (max-width: 420px){
      .stage{ min-height: 460px; }
      .button-zone{ height: 200px; }
      #yesBtn{
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
      }
      #noBtn{
        right: auto;
        left: 50%;
        top: 68%;
        transform: translate(-50%, -50%);
      }
    }

    .hint{
      margin-top: 10px;
      font-size: 13px;
      opacity: .75;
    }

    /* YES PAGE */
    .yes-title{
      font-size: clamp(26px, 6.2vw, 52px);
      margin: 6px 0 2px;
      letter-spacing: .2px;
    }

    .yes-detail{
      font-size: clamp(14px, 2.6vw, 16px);
      opacity: .8;
      margin: 0 0 10px;
      padding: 0 10px;
    }

    .chips{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content:center;
      margin: 6px 0 10px;
    }
    .chip{
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      font-weight: 700;
      font-size: 13px;
    }

    .fireworks{
      width: min(420px, 92vw);
      margin: 2px auto 0;
      display:block;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.12);
    }

    /* Glow synced to music */
    .glow{
      animation: glowPulse 900ms ease-in-out infinite;
      text-shadow:
        0 0 12px rgba(255,59,122,.35),
        0 0 24px rgba(255,59,122,.25),
        0 0 48px rgba(255,59,122,.18);
    }

    @keyframes glowPulse{
      0%   { transform: translateY(0) scale(1);   filter: saturate(1); }
      50%  { transform: translateY(-1px) scale(1.015); filter: saturate(1.15); }
      100% { transform: translateY(0) scale(1);   filter: saturate(1); }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <!-- Hidden YouTube player (audio-only effect) -->
  <div id="yt-player" style="position:fixed; left:-9999px; top:-9999px; width:1px; height:1px; opacity:0;"></div>

  <main class="card" id="card">
    <button id="muteBtn" type="button" aria-label="Mute/unmute">🔇</button>

    <div class="stage">
      <!-- PAGE 1: QUESTION -->
      <section class="page" id="questionPage" aria-label="Question page">
        <!-- ANIMAL WITH HEART -->
        <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="fur" x1="0" x2="1">
              <stop offset="0" stop-color="#f7c7a1"/>
              <stop offset="1" stop-color="#f2a97b"/>
            </linearGradient>
            <linearGradient id="heart" x1="0" x2="1">
              <stop offset="0" stop-color="#ff4d7d"/>
              <stop offset="1" stop-color="#ff1f68"/>
            </linearGradient>
          </defs>

          <path d="M250 50 C250 33 270 25 282 38
            C294 25 314 33 314 50
            C314 78 282 92 282 106
            C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

          <path d="M90 120 C90 70 140 40 190 60
            C240 40 290 70 290 120
            C290 180 240 210 190 210
            C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

          <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
          <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

          <circle cx="160" cy="130" r="8"/>
          <circle cx="220" cy="130" r="8"/>

          <path d="M190 144 C186 144 182 148 182 152
            C182 160 190 164 190 170
            C190 164 198 160 198 152
            C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
        </svg>

        <h1>Dr. Disha Sethi, will you be my valentine?</h1>
        <p class="sub">Just one click… no pressure 😌</p>

        <section class="button-zone" id="zone" aria-label="Valentine buttons">
          <button class="choice" id="yesBtn" type="button">Yes</button>
          <button class="choice" id="noBtn" type="button">No</button>
        </section>

        <div class="hint" id="hint">“No” seems a bit shy 😈</div>
      </section>

      <!-- PAGE 2: YES -->
      <section class="page" id="yesPage" aria-label="Yes page">
        <div style="height:6px"></div>
        <h1 class="yes-title" id="yesTitle">She said YES 💖</h1>
        <p class="yes-detail">February 14th • 9:00 PM IST • our computer screens :D</p>

        <div class="chips" aria-label="Plan chips">
          <span class="chip">🎧 The Night We Met</span>
          <span class="chip">💬 Video call date</span>
          <span class="chip">🍿 Snacks ready</span>
        </div>

        <img
          class="fireworks"
          src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
          alt="Fireworks"
        />
      </section>
    </div>
  </main>

  <script>
    const card = document.getElementById("card");
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");
    const muteBtn = document.getElementById("muteBtn");
    const yesTitle = document.getElementById("yesTitle");

    /* ---------- CONFETTI ---------- */
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 200));

    const confettiInstance = (window.confetti && window.confetti.create)
      ? window.confetti.create(confettiCanvas, { resize: false, useWorker: true })
      : null;

    function fullScreenConfetti() {
      if (!confettiInstance) return;

      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.35 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 260,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 280);
    }

    /* ---------- YES BUTTON GROWS ---------- */
    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.1, yesScale + 0.08);

      if (window.matchMedia("(max-width: 420px)").matches) {
        yesBtn.style.transform = `translate(-50%, -50%) scale(${yesScale})`;
      } else {
        yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
      }
    }

    /* ---------- NO BUTTON RUNS AWAY ---------- */
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      const step = window.matchMedia("(max-width: 420px)").matches ? 120 : 150;

      let newLeft = (b.left - z.left) + dx * step;
      let newTop  = (b.top  - z.top ) + dy * step;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop,  0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.right = "auto";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top  + b.height / 2) - e.clientY
      );
      const threshold = window.matchMedia("(max-width: 420px)").matches ? 110 : 140;
      if (d < threshold) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("pointerdown", e => {
      moveNo(e.clientX, e.clientY);
      e.preventDefault();
    });
    noBtn.addEventListener("click", e => e.preventDefault());

    /* ---------- YOUTUBE MUSIC (chorus start + fade in) ---------- */
    let player;
    let fadeInterval;
    let ytReady = false;
    let ytStarted = false;
    let ytMuted = true;

    const VIDEO_ID = "KtlgYxa6BMU";  // Lord Huron - The Night We Met (Official Audio)
    const CHORUS_START = 48;         // seconds
    const TARGET_VOLUME = 60;        // 0..100

    function setMuteIcon() {
      muteBtn.textContent = (ytStarted && !ytMuted) ? "🔊" : "🔇";
    }
    setMuteIcon();

    // REQUIRED global callback for YouTube API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player("yt-player", {
        height: "0",
        width: "0",
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          start: CHORUS_START,
          modestbranding: 1,
          rel: 0
        },
        events: {
          onReady: () => {
            ytReady = true;
            try { player.setVolume(0); } catch (_) {}
          }
        }
      });
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function fadeInYouTube() {
      if (!player) return;
      clearInterval(fadeInterval);

      let vol = 0;
      try { player.setVolume(0); } catch (_) {}

      fadeInterval = setInterval(() => {
        vol += 5;
        if (vol >= TARGET_VOLUME) {
          vol = TARGET_VOLUME;
          clearInterval(fadeInterval);
        }
        try { player.setVolume(vol); } catch (_) {}
      }, 120);
    }

    function startYouTubeMusic() {
      if (!ytReady || !player) return;

      try {
        player.seekTo(CHORUS_START, true);
        player.playVideo();

        ytStarted = true;
        ytMuted = false;
        setMuteIcon();

        // start glow synced to music start
        yesTitle.classList.add("glow");

        fadeInYouTube();
      } catch (_) {}
    }

    muteBtn.addEventListener("click", () => {
      if (!player || !ytStarted) return;
      ytMuted = !ytMuted;

      try { player.setVolume(ytMuted ? 0 : TARGET_VOLUME); } catch (_) {}

      // keep glow only when unmuted (feels "synced")
      if (ytMuted) yesTitle.classList.remove("glow");
      else yesTitle.classList.add("glow");

      setMuteIcon();
    });

    /* ---------- YES CLICK (transition + music + confetti) ---------- */
    yesBtn.addEventListener("click", () => {
      // slide to page 2
      card.classList.add("show-yes");

      // stop interactions on old page
      zone.style.display = "none";
      hint.style.display = "none";

      // start music first, then confetti slightly later
      resizeConfettiCanvas();
      startYouTubeMusic();
      setTimeout(() => fullScreenConfetti(), 420);
    });
  </script>
</body>
</html>
