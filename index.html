<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Will you be my Valentine?</title>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
:root{
  --bg1:#ffd6e7;
  --bg2:#ffeef6;
  --card:#ffffffcc;
  --yes:#ff3b7a;
  --yesHover:#ff1f68;
  --text:#111827;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-items:center;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);

  /* IMPORTANT: allow vertical scrolling */
  overflow-y:auto;
  overflow-x:hidden;

  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}

/* CONFETTI */
#confettiCanvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:9999;
}

/* CARD */
.card{
  width:min(720px, 92vw);
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  box-shadow: 0 18px 60px rgba(0,0,0,.15);
  position: relative;

  max-height: calc(100svh - 32px);
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;

  padding: clamp(18px, 3.6vw, 26px) clamp(16px, 3vw, 22px);
}

/* MUTE */
#muteBtn{
  position:absolute;
  top:12px;
  right:12px;
  border:none;
  border-radius:999px;
  padding:10px 12px;
  font-size:18px;
  cursor:pointer;
  background:rgba(255,255,255,.9);
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* SLIDE SYSTEM */
.stage{ width:100%; overflow:hidden; }

.pages{
  display:flex;
  width:200%;
  transition:transform .55s cubic-bezier(.2,.9,.2,1);
}

.card.show-yes .pages{
  transform: translateX(-50%);
}

.page{
  width:50%;
  padding-bottom:20px;
}

/* ART */
.art{
  width:min(240px, 70vw);
  display:block;
  margin:10px auto 6px;
}

h1{
  font-size:clamp(22px,5.5vw,44px);
  line-height:1.15;
  margin:6px 0 10px;
  text-align:center;
}

.sub{
  font-size:14px;
  opacity:.75;
  text-align:center;
}

/* BUTTONS */
.button-zone{
  position:relative;
  width:min(520px,100%);
  height:160px;
  margin:10px auto 0;
}

.choice{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  padding:16px 24px;
  font-size:18px;
  font-weight:800;
  border-radius:999px;
  border:none;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}

#yesBtn{
  left:10%;
  background:var(--yes);
  color:white;
}

#noBtn{
  right:10%;
  background:#e5e7eb;
}

/* Mobile stack */
@media(max-width:420px){
  .button-zone{ height:200px; }
  #yesBtn{ left:50%; top:38%; transform:translate(-50%,-50%); }
  #noBtn{ left:50%; top:68%; transform:translate(-50%,-50%); }
}

.hint{
  margin-top:8px;
  font-size:13px;
  opacity:.75;
  text-align:center;
}

/* YES PAGE */
.yes-title{
  font-size:clamp(26px,6.5vw,52px);
  margin-top:12px;
}

.yes-detail{
  opacity:.8;
  margin-bottom:10px;
  text-align:center;
}

.chips{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.chip{
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.7);
  font-weight:700;
  font-size:13px;
}

/* GLOW */
.glow{
  animation: glowPulse 900ms infinite;
  text-shadow:0 0 14px rgba(255,59,122,.4);
}

@keyframes glowPulse{
  50%{ transform:scale(1.03); }
}

/* SHORT SCREENS */
@media(max-height:700px){
  .art{ width:200px; }
  .button-zone{ height:140px; }
}
</style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>
<div id="yt-player" style="display:none"></div>

<main class="card" id="card">
<button id="muteBtn">🔇</button>

<div class="stage">
<div class="pages">

<!-- PAGE 1 -->
<section class="page">
<svg class="art" viewBox="0 0 320 240">
<circle cx="160" cy="120" r="90" fill="#f2a97b"/>
<circle cx="140" cy="110" r="6"/>
<circle cx="180" cy="110" r="6"/>
<path d="M160 125 C155 135 165 135 160 145" fill="#ff7aa2"/>
<path d="M200 50 C200 30 230 30 230 50 C230 75 200 85 200 100" fill="#ff4d7d"/>
</svg>

<h1>Dr. Disha Sethi, will you be my valentine?</h1>
<p class="sub">Just one click… no pressure 😊</p>

<div class="button-zone" id="zone">
<button class="choice" id="yesBtn">Yes</button>
<button class="choice" id="noBtn">No</button>
</div>

<div class="hint" id="hint">“No” seems a bit shy 😈</div>
</section>

<!-- PAGE 2 -->
<section class="page">
<h1 class="yes-title" id="yesTitle">She said YES 💖</h1>
<p class="yes-detail">February 14th • 9:00 PM IST • our screens 💻</p>

<div class="chips">
<span class="chip">🎧 Endless Conversations</span>
<span class="chip">💬 Movie Night</span>
<span class="chip">🍿 Yummy Food</span>
</div>

<img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" style="width:100%;border-radius:14px">
</section>

</div>
</div>
</main>

<script>
const card = document.getElementById("card");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const zone = document.getElementById("zone");
const hint = document.getElementById("hint");
const yesTitle = document.getElementById("yesTitle");
const muteBtn = document.getElementById("muteBtn");

/* NO RUN AWAY */
/* NO RUN AWAY (proper + no stretching) */
function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function moveNoAway(pointerX, pointerY) {
  const z = zone.getBoundingClientRect();
  const b = noBtn.getBoundingClientRect();

  // pointer position relative to the zone
  const px = pointerX - z.left;
  const py = pointerY - z.top;

  // current center of the button relative to the zone
  const cx = (b.left - z.left) + b.width / 2;
  const cy = (b.top - z.top) + b.height / 2;

  // direction away from pointer
  let dx = cx - px;
  let dy = cy - py;
  const mag = Math.hypot(dx, dy) || 1;
  dx /= mag;
  dy /= mag;

  // how far to jump each time
  const step = 140;

  // new top-left (relative to zone)
  let newLeft = (b.left - z.left) + dx * step;
  let newTop  = (b.top  - z.top ) + dy * step;

  // keep inside zone
  newLeft = clamp(newLeft, 0, z.width - b.width);
  newTop  = clamp(newTop,  0, z.height - b.height);

  // IMPORTANT: clear 'right' so it doesn't stretch
  noBtn.style.right = "auto";
  noBtn.style.left = newLeft + "px";
  noBtn.style.top  = newTop + "px";

  // keep transform consistent (avoid weird jumps)
  noBtn.style.transform = "none";
}

zone.addEventListener("pointermove", (e) => {
  const b = noBtn.getBoundingClientRect();
  const d = Math.hypot(
    (b.left + b.width / 2) - e.clientX,
    (b.top + b.height / 2) - e.clientY
  );
  if (d < 140) moveNoAway(e.clientX, e.clientY);
});

// make clicking "No" impossible
noBtn.addEventListener("click", (e) => e.preventDefault());
noBtn.addEventListener("pointerdown", (e) => {
  moveNoAway(e.clientX, e.clientY);
  e.preventDefault();
});

/* CONFETTI */
const confettiCanvas=document.getElementById("confettiCanvas");
confettiCanvas.width=window.innerWidth;
confettiCanvas.height=window.innerHeight;
const confettiInstance=confetti.create(confettiCanvas,{resize:true});

/* MUSIC */
let player,muted=true;
function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt-player",{videoId:"KtlgYxa6BMU",playerVars:{start:48}});
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;

/* YES CLICK */
yesBtn.onclick=()=>{
  card.classList.add("show-yes");
  zone.style.display="none";
  hint.style.display="none";

  player.playVideo();
  player.setVolume(60);
  muted=false;
  muteBtn.textContent="🔊";
  yesTitle.classList.add("glow");

  confettiInstance({particleCount:200,spread:120});
};

muteBtn.onclick=()=>{
  if(!player) return;
  muted=!muted;
  player.setVolume(muted?0:60);
  muteBtn.textContent=muted?"🔇":"🔊";
  yesTitle.classList.toggle("glow",!muted);
};
</script>
</body>
</html>
