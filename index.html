<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Will you be my Valentine?</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root{
  --bg1:#ffd6e7;
  --bg2:#ffeef6;
  --card:#ffffffcc;
  --yes:#ff3b7a;
  --yesHover:#ff1f68;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100svh; /* modern mobile viewport */
  display:grid;
  place-items:center;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  overflow:hidden;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}

/* FULL-SCREEN CONFETTI CANVAS */
#confettiCanvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:9999;
}

.card{
  width:min(720px, 92vw);
  padding: clamp(18px, 3.6vw, 26px) clamp(16px, 3vw, 22px);
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  text-align:center;
  box-shadow: 0 18px 60px rgba(0,0,0,.15);
}

.art{
  width: min(240px, 68vw);
  margin: 0 auto 10px;
  display:block;
  filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
}

h1{
  font-size: clamp(22px, 5.4vw, 44px);
  line-height: 1.1;
  margin: 12px 0 16px;
  padding: 0 6px;
}

/* Button zone becomes responsive */
.button-zone{
  position: relative;
  width: min(560px, 100%);
  height: clamp(140px, 22vh, 180px);
  margin: 0 auto;
  touch-action: none;
}

/* Buttons are bigger + safer on mobile */
button{
  position:absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 16px 22px;
  min-width: 120px;
  font-size: 18px;
  font-weight: 800;
  border-radius: 999px;
  border:none;
  cursor:pointer;
  box-shadow: 0 10px 24px rgba(0,0,0,.14);
  user-select:none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease, background .12s ease;
  touch-action: manipulation; /* helps on mobile */
}

#yesBtn{
  left: 10%;
  background: var(--yes);
  color:#fff;
}
#yesBtn:hover{ background: var(--yesHover); }

#noBtn{
  right: 10%;
  left: auto;
  background:#e5e7eb;
  color:#111827;
}

/* On very small screens, stack vertically so they never clash */
@media (max-width: 420px){
  .button-zone{ height: 200px; }
  #yesBtn{
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
  }
  #noBtn{
    right: auto;
    left: 50%;
    top: 68%;
    transform: translate(-50%, -50%);
  }
}

.hint{
  margin-top: 10px;
  font-size: 13px;
  opacity: .75;
}

.result{
  display:none;
  margin-top: 18px;
