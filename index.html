<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Will you be my Valentine?</title>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
:root{
  --bg1:#ffd6e7;
  --bg2:#ffeef6;
  --card:#ffffffcc;
  --yes:#ff3b7a;
  --yesHover:#ff1f68;
  --text:#111827;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-items:center;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  overflow-y:auto;
  overflow-x:hidden;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}

/* CONFETTI */
#confettiCanvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:9999;
}

/* CARD */
.card{
  width:min(720px, 92vw);
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  box-shadow: 0 18px 60px rgba(0,0,0,.15);
  position: relative;
  max-height: calc(100svh - 32px);
  overflow:auto;
  padding: clamp(18px, 3.6vw, 26px);
}

/* MUTE */
#muteBtn{
  position:absolute;
  top:12px;
  right:12px;
  border:none;
  border-radius:999px;
  padding:10px 12px;
  font-size:18px;
  cursor:pointer;
  background:rgba(255,255,255,.9);
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  z-index:10;
}

/* SLIDES */
.stage{ overflow:hidden; }
.pages{
  display:flex;
  width:200%;
  transition:transform .55s cubic-bezier(.2,.9,.2,1);
}
.card.show-yes .pages{ transform:translateX(-50%); }
.page{ width:50%; }

/* ART */
.art{
  width:min(240px,70vw);
  display:block;
  margin:10px auto;
}

/* TEXT */
h1{ text-align:center; }
.sub{ text-align:center; opacity:.75; }

/* BUTTONS */
.button-zone{
  position:relative;
  height:160px;
  margin-top:10px;
}
.choice{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  padding:16px 24px;
  font-size:18px;
  font-weight:800;
  border-radius:999px;
  border:none;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
#yesBtn{ left:10%; background:var(--yes); color:#fff; }
#noBtn{ right:10%; background:#e5e7eb; }

/* YES PAGE */
.yes-title{
  font-size:clamp(26px,6.5vw,52px);
  margin-top:12px;
}
.glow{
  animation: glowPulse 900ms infinite;
  text-shadow:0 0 18px rgba(255,59,122,.5);
}
@keyframes glowPulse{ 50%{ transform:scale(1.04); } }

/* PHOTO */
.memory-photo{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
  animation: photoReveal .8s ease both, photoPulse 2.8s ease-in-out infinite;
  cursor:pointer;
}
@keyframes photoReveal{
  from{ opacity:0; transform:scale(.96) translateY(10px); }
  to{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes photoPulse{
  50%{ transform:scale(1.015); }
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:9998;
}
#modalContent{
  background:#fff;
  border-radius:18px;
  padding:20px;
  max-width:520px;
  width:100%;
  box-shadow:0 18px 60px rgba(0,0,0,.25);
  animation: pop .35s ease;
}
@keyframes pop{
  from{ transform:scale(.95); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
</style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>

<div id="yt-player" style="position:fixed;left:-9999px;width:1px;height:1px;"></div>

<main class="card" id="card">
<button id="muteBtn">🔇</button>

<div class="stage">
<div class="pages">

<!-- PAGE 1 -->
<section class="page">
  <svg class="art" viewBox="0 0 320 240">
    <circle cx="160" cy="120" r="90" fill="#f2a97b"/>
  </svg>
  <h1>Dr. Disha Sethi, will you be my Valentine?</h1>
  <p class="sub">Just one click… no pressure 😊</p>
  <div class="button-zone" id="zone">
    <button class="choice" id="yesBtn">Yes</button>
    <button class="choice" id="noBtn">No</button>
  </div>
</section>

<!-- PAGE 2 -->
<section class="page">
  <h1 class="yes-title" id="yesTitle">Wohooo! Dishu said YES 💖</h1>
  <p class="sub">I love you baby. Today, tomorrow, always.</p>

  <img src="us.jpeg" alt="Us ❤️" class="memory-photo" id="photo">

  <p style="text-align:center;margin-top:10px;opacity:.8;">
    Tap the photo 💌
  </p>
</section>

</div>
</div>
</main>

<!-- MODAL -->
<div id="modal">
  <div id="modalContent">
    <h3>💖 For you, Dishu</h3>
    <p>
      One day, this won’t be on screens.  
      It’ll be right in front of you.  
      Until then… it’s always you. Always us.
    </p>
    <button onclick="modal.style.display='none'" style="margin-top:10px;">Close</button>
  </div>
</div>

<script>
/* CONFETTI */
const confettiInstance = confetti.create(document.getElementById("confettiCanvas"),{resize:true});

/* NO BUTTON RUN */
const noBtn=document.getElementById("noBtn");
const zone=document.getElementById("zone");
zone.addEventListener("pointermove",e=>{
  const r=noBtn.getBoundingClientRect();
  if(Math.hypot(r.x-e.clientX,r.y-e.clientY)<120){
    noBtn.style.left=Math.random()*60+"%";
    noBtn.style.top=Math.random()*60+"%";
  }
});

/* MUSIC */
let player, muted=true;
function onYouTubeIframeAPIReady(){
  player=new YT.Player("yt-player",{videoId:"KtlgYxa6BMU",playerVars:{start:48}});
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;

/* YES */
document.getElementById("yesBtn").onclick=()=>{
  card.classList.add("show-yes");
  player.playVideo();
  player.setVolume(60);
  muted=false;
  document.getElementById("yesTitle").classList.add("glow");

  confettiInstance({particleCount:200,spread:140});
};

/* MUTE */
document.getElementById("muteBtn").onclick=()=>{
  muted=!muted;
  player.setVolume(muted?0:60);
};

/* PHOTO TAP */
const modal=document.getElementById("modal");
document.getElementById("photo").onclick=()=>{
  modal.style.display="flex";
  confettiInstance({particleCount:60,spread:100,origin:{y:.6}});
};
</script>
</body>
</html>
